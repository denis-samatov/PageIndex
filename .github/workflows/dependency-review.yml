name: Dependency Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit every locked dependency without Dependency Graph
        # Full-profile audit rejects every known vulnerability, not just newly
        # introduced moderate findings. Resolution failures also fail the job.
        run: python -m pip_audit --strict --disable-pip --require-hashes --vulnerability-service osv -r requirements-ci-py${{ matrix.python-version }}-linux.lock
