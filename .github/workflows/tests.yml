name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        agent-frameworks: [without, with]
        pdfium: ["5"]
        include:
          # one leg holds the 4.x insurance line
          - python-version: "3.11"
            agent-frameworks: with
            pdfium: "4"
    name: py${{ matrix.python-version }} (${{ matrix.agent-frameworks }} frameworks, pdfium ${{ matrix.pdfium }})
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --require-hashes -r requirements-ci-py${{ matrix.python-version }}-linux.lock
      - if: matrix.agent-frameworks == 'without'
        # Remove all optional frameworks to keep this a real absence-path test.
        run: pip uninstall -y openai-agents claude-agent-sdk anthropic
      - if: matrix.pdfium == '4'
        # Legacy compatibility insurance only; the supported/audited profile is 5.x.
        run: pip install "pypdfium2<5"
      - run: python -m pytest -q
